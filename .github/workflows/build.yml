name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: authored and grown (lualatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            florilegium.tex
            florilegium-grow.tex
            showcase.tex
            book-demo.tex
            asset-demo.tex
            folio-demo.tex
            specimen.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils inkscape
          post_compile: >-
            texlua tools/contractcheck.lua &&
            texlua tools/replaycheck.lua &&
            python3 tools/determinism_oracle.py &&
            texlua tools/geometrycheck.lua &&
            python3 tools/geometry_oracle.py &&
            texlua tools/scenecheck.lua &&
            python3 tools/scene_oracle.py &&
            texlua tools/plannercheck.lua &&
            python3 tools/planner_oracle.py &&
            texlua tools/botanicalcheck.lua --legacy-layout &&
            python3 tools/botanical_oracle.py &&
            texlua tools/periodiccheck.lua &&
            python3 tools/periodic_oracle.py &&
            texlua tools/celticcheck.lua &&
            python3 tools/celtic_oracle.py &&
            texlua tools/islamiccheck.lua &&
            python3 tools/islamic_oracle.py &&
            texlua tools/freeformcheck.lua &&
            python3 tools/freeform_oracle.py &&
            texlua tools/substitutioncheck.lua &&
            python3 tools/substitution_oracle.py &&
            texlua tools/penrosecheck.lua &&
            python3 tools/penrose_oracle.py &&
            texlua tools/spectrecheck.lua &&
            python3 tools/spectre_oracle.py &&
            texlua tools/integrationcheck.lua &&
            python3 tools/integration_oracle.py &&
            texlua tools/beenkercheck.lua &&
            python3 tools/beenker_oracle.py &&
            texlua tools/hatcheck.lua &&
            python3 tools/hat_oracle.py &&
            texlua tools/tracerycheck.lua &&
            python3 tools/tracery_oracle.py &&
            texlua tools/eschercheck.lua &&
            python3 tools/escher_oracle.py &&
            texlua tools/mosaiccheck.lua &&
            python3 tools/mosaic_oracle.py &&
            texlua tools/strokecheck.lua &&
            python3 tools/stroke_oracle.py &&
            texlua tools/mazecheck.lua &&
            python3 tools/maze_oracle.py &&
            texlua tools/micrographycheck.lua &&
            python3 tools/micrography_oracle.py &&
            texlua tools/check-deco-integration.lua &&
            texlua tools/decocheck.lua &&
            python3 tools/deco_oracle.py &&
            texlua tools/gothiccheck.lua &&
            python3 tools/gothic_oracle.py &&
            texlua tools/collectioncheck.lua &&
            python3 tools/collection_oracle.py &&
            texlua tools/check-cli-core.lua &&
            python3 tools/clicheck.py &&
            texlua tools/layoutcheck.lua &&
            texlua tools/spacecheck.lua &&
            texlua tools/initialcheck.lua &&
            texlua tools/backendcheck.lua &&
            python3 tools/layoutsmoke.py &&
            python3 tools/bookcheck.py &&
            texlua tools/animcheck.lua 1 6
      - uses: actions/upload-artifact@v4
        with:
          name: florilegium-pdfs
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            book-demo.pdf
            asset-demo.pdf
            folio-demo.pdf
            specimen.pdf
            build/scenes/
            build/planner/
            build/botanical/
            build/periodic/
            build/celtic/
            build/islamic/
            build/freeform/
            build/substitution/
            build/penrose/
            build/spectre/
            build/integration/
            build/beenker/
            build/hat/
            build/tracery/
            build/escher/
            build/mosaic/
            build/strokes/
            build/maze/
            build/micrography/
            build/decobrush/
            build/gothic/
            build/collection/
            build/cli-core/
            build/cli/

  patterns-luatex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: common semantic patterns in real LuaLaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: folio-demo.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow py3-pypdf poppler-utils
          post_compile: >-
            texlua tools/check-pattern-tex.lua &&
            texlua tools/check-pattern-luatex-host.lua &&
            python3 tools/pattern_tex_consumer.py
      - name: make common-pattern verification files readable
        if: always()
        run: |
          for folder in build/pattern-tex build/pattern-luatex-host build/pattern-luatex; do
            if [ -d "$folder" ]; then sudo chmod -R a+rX "$folder"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: florilegium-common-luatex
          path: |
            build/pattern-tex/
            build/pattern-luatex-host/
            build/pattern-luatex/

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: shared renderer and source kit
        uses: xu-cheng/latex-action@v3
        with:
          root_file: folio-demo.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils inkscape
          post_compile: >-
            python3 tools/enginecheck.py --require-outlines &&
            python3 tools/offsetcheck.py &&
            python3 tools/exportcheck.py &&
            python3 tools/visualcheck.py &&
            python3 tools/foliopreview.py &&
            python3 tools/build.py folio-demo.tex --engine xe --output-dir build/xe &&
            python3 tools/packagecheck.py &&
            python3 tools/botanical_enginecheck.py
      - name: make container build evidence readable
        if: always()
        run: sudo chmod -R a+rX build
      - uses: actions/upload-artifact@v4
        with:
          name: florilegium-portable-kit
          path: |
            build/florilegium-v1.4-source.zip
            build/xe/folio-demo.pdf
            gallery/folio-guide.png
            gallery/folio-labels.png
            build/botanical-engine-*/receipt.json
      - name: preserve portable failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: florilegium-portable-failure
          path: |
            build/engine-check-*/
            build/offset-check/
            build/botanical-engine-*/
          if-no-files-found: ignore

  gallery:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: render six seeds
        uses: xu-cheng/latex-action@v3
        with:
          root_file: gallery.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils
          post_compile: >-
            python3 tools/gallery.py --seeds 1 2 3 4 5 6 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --inks 2456C4 5B2A1F 2F6B4F 8E1B3A 4B3B8F 1D6E7A --jobs 2 &&
            python3 tools/gallery.py --seed 6 --ages 0 0.33 0.67 1 --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery/

